
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTEL - Đăng nhập</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    font-size: 13px;
}

header {
    height: 48px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5%;
}

.logo {
    font-weight: bold;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    text-decoration: none;
    color: #555;
    cursor: pointer;
    font-size: 11px;
}

main {
    display: flex;
    justify-content: center;
    padding: 65px 15px;
}

.auth-box {
    width: 390px;
    background: white;
    border: 1px solid #ddd;
    padding: 25px;
}

h2 {
    font-size: 18px;
    margin: 0 0 22px;
}

.form-group {
    margin-bottom: 17px;
}

label {
    display: block;
    margin-bottom: 7px;
    font-size: 12px;
}

input, select {
    width: 100%;
    height: 35px;
    border: 1px solid #ccc;
    padding: 7px;
    outline: none;
    background: white;
}

input:focus, select:focus {
    border-color: #777;
}

button {
    border: 1px solid #ccc;
    background: #e5e5e5;
    padding: 9px 18px;
    cursor: pointer;
    font-size: 11px;
}

button:hover {
    background: #d5d5d5;
}

.submit {
    width: 100%;
}

.actions {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

.switch {
    text-align: center;
    margin-top: 18px;
    color: #666;
    font-size: 11px;
}

.switch a {
    color: #222;
    text-decoration: underline;
    cursor: pointer;
}

.message {
    font-size: 12px;
    margin-top: 12px;
}

.hidden {
    display: none;
}

@media(max-width: 500px) {
    header {
        padding: 0 12px;
    }

    nav {
        gap: 10px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">HOTEL - QUẢN LÝ KHÁCH SẠN</div>

    <nav>
        <a onclick="showLogin()">Đăng nhập</a>
        <a onclick="showRegister()">Đăng ký</a>
        <a href="thongke.html">Thống kê</a>
    </nav>
</header>

<main>

    <!-- GIAO DIỆN ĐĂNG NHẬP -->

    <section class="auth-box" id="loginBox">

        <h2>Đăng nhập</h2>

        <form id="loginForm">

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text"
                       id="loginUsername"
                       placeholder="Nhập tên đăng nhập"
                       required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password"
                       id="loginPassword"
                       placeholder="Nhập mật khẩu"
                       required>
            </div>

            <button class="submit" type="submit">
                Đăng nhập
            </button>

            <p class="message" id="loginMessage"></p>

        </form>

        <p class="switch">
            Chưa có tài khoản?
            <a onclick="showRegister()">Đăng ký ngay</a>
        </p>

    </section>


    <!-- GIAO DIỆN ĐĂNG KÝ -->

    <section class="auth-box hidden" id="registerBox">

        <h2>Đăng ký tài khoản</h2>

        <form id="registerForm">

            <div class="form-group">
                <label>Họ tên</label>
                <input type="text"
                       id="fullName"
                       placeholder="Nhập họ tên"
                       required>
            </div>

            <div class="form-group">
                <label>Tên đăng nhập</label>
                <input type="text"
                       id="registerUsername"
                       placeholder="Nhập tên đăng nhập"
                       required>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password"
                       id="registerPassword"
                       minlength="6"
                       placeholder="Nhập mật khẩu"
                       required>
            </div>

            <div class="form-group">
                <label>Vai trò</label>
                <select id="role" required>
                    <option value="">-- Chọn vai trò --</option>
                    <option value="Quản lý">Quản lý</option>
                    <option value="Nhân viên">Nhân viên</option>
                </select>
            </div>

            <div class="actions">

                <button type="button" onclick="showLogin()">
                    Hủy
                </button>

                <button type="submit">
                    Tạo tài khoản
                </button>

            </div>

            <p class="message" id="registerMessage"></p>

        </form>

        <p class="switch">
            Đã có tài khoản?
            <a onclick="showLogin()">Đăng nhập</a>
        </p>

    </section>

</main>

<script>

// Chuyển sang giao diện đăng nhập
function showLogin() {
    document.getElementById("loginBox").classList.remove("hidden");
    document.getElementById("registerBox").classList.add("hidden");
}

// Chuyển sang giao diện đăng ký
function showRegister() {
    document.getElementById("registerBox").classList.remove("hidden");
    document.getElementById("loginBox").classList.add("hidden");
}

// Xử lý đăng ký minh họa
document.getElementById("registerForm").onsubmit = function(e) {

    e.preventDefault();

    document.getElementById("registerMessage").innerText =
        "Đăng ký thành công! (Dữ liệu minh họa)";

};

// Xử lý đăng nhập minh họa
document.getElementById("loginForm").onsubmit = function(e) {

    e.preventDefault();

    window.location.href = "thongke.html";

};

</script>

</body>
</html>
