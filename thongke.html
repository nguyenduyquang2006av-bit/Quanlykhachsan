
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOTEL - Thống kê</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    font-size: 13px;
}

header {
    height: 48px;
    background: white;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 5%;
}

.logo {
    font-weight: bold;
}

nav {
    display: flex;
    gap: 22px;
}

nav a {
    color: #555;
    text-decoration: none;
    font-size: 11px;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: 35px auto;
}

h2 {
    font-size: 18px;
    margin-bottom: 22px;
}

.filter {
    display: flex;
    align-items: end;
    gap: 15px;
    background: white;
    border: 1px solid #ddd;
    padding: 15px;
    margin-bottom: 18px;
}

.field label {
    display: block;
    font-size: 12px;
    margin-bottom: 7px;
}

input {
    width: 250px;
    height: 34px;
    border: 1px solid #ccc;
    padding: 7px;
}

button {
    border: 1px solid #ccc;
    background: #e5e5e5;
    padding: 9px 18px;
    font-size: 11px;
    cursor: pointer;
}

button:hover {
    background: #d5d5d5;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 18px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    padding: 18px;
    min-height: 95px;
}

.card p {
    margin: 0 0 12px;
    font-size: 12px;
}

.card h3 {
    font-size: 21px;
    margin: 0;
}

.chart {
    background: white;
    border: 1px solid #ddd;
    padding: 20px;
    min-height: 190px;
}

.chart h3 {
    font-size: 14px;
    margin: 0 0 8px;
}

.chart p {
    font-size: 11px;
    color: #777;
    margin: 0;
}

.bars {
    height: 115px;
    display: flex;
    align-items: end;
    gap: 20px;
    padding: 0 20px;
    border-bottom: 1px solid #ddd;
    margin-top: 15px;
}

.bar {
    flex: 1;
    max-width: 70px;
    background: #d6d6d6;
}

@media(max-width: 650px) {

    .filter {
        align-items: stretch;
        flex-direction: column;
    }

    input {
        width: 100%;
    }

    .cards {
        grid-template-columns: 1fr;
    }

    .container {
        width: 94%;
    }

}
</style>
</head>

<body>

<header>

    <div class="logo">
        HOTEL - QUẢN LÝ KHÁCH SẠN
    </div>

    <nav>
        <a href="index.html">Đăng nhập / Đăng ký</a>
        <a href="thongke.html">Thống kê</a>
    </nav>

</header>

<main class="container">

    <h2>Thống kê</h2>

    <!-- BỘ LỌC THỜI GIAN -->

    <section class="filter">

        <div class="field">

            <label>Khoảng thời gian</label>

            <input type="month" id="period">

        </div>

        <button onclick="filterStatistics()">
            Xem thống kê
        </button>

    </section>


    <!-- CÁC Ô THỐNG KÊ -->

    <section class="cards">

        <div class="card">
            <p>Doanh thu</p>
            <h3>86.500.000đ</h3>
        </div>

        <div class="card">
            <p>Lượt lưu trú</p>
            <h3>128</h3>
        </div>

        <div class="card">
            <p>Công suất phòng</p>
            <h3>78%</h3>
        </div>

    </section>


    <!-- BIỂU ĐỒ -->

    <section class="chart">

        <h3>Biểu đồ tổng quan</h3>

        <p>Doanh thu và lượt lưu trú theo thời gian</p>

        <div class="bars">

            <div class="bar" style="height:35%"></div>

            <div class="bar" style="height:55%"></div>

            <div class="bar" style="height:45%"></div>

            <div class="bar" style="height:75%"></div>

            <div class="bar" style="height:60%"></div>

            <div class="bar" style="height:95%"></div>

        </div>

    </section>

</main>

<script>

function filterStatistics() {

    const period = document.getElementById("period").value;

    if (period === "") {

        alert("Vui lòng chọn khoảng thời gian!");

    } else {

        alert("Đã chọn khoảng thời gian: " + period);

    }

}

</script>

</body>
</html>
